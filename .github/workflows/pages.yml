name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        working-directory: apps/web
        run: npm ci

      - name: Build (static, base /54d/)
        working-directory: apps/web
        env:
          GITHUB_PAGES: "true"
          # Valores públicos por diseño (publishable key + URL del proyecto)
          VITE_SUPABASE_URL: https://utbakeinkpuwnalfmawo.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_clBGi1umJFmNyPGEOiKTGg_EQenQd2c
          # Sin API worker deployado todavía: checkout/leads no funcionan en el preview
          VITE_API_URL: ""
        run: npx react-router build

      - name: Flatten basename + SPA fallback + nojekyll
        working-directory: apps/web
        run: |
          # 1. El index.html raíz del build es el fallback SPA → será el 404 de Pages
          cp build/client/index.html build/client/404.html
          # 2. El prerender anida bajo build/client/54d/ (basename) — aplanar,
          #    porque Pages ya sirve el artifact bajo /54d/
          cp -R build/client/54d/. build/client/
          rm -rf build/client/54d
          touch build/client/.nojekyll

      # Requiere Pages habilitado UNA vez a mano:
      # Settings → Pages → Build and deployment → Source: "GitHub Actions"
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
